name: Compose validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default compose file
        run: docker compose --env-file .env.example config --quiet
      - name: Validate N1 compose file
        run: docker compose --env-file .env.example -f docker-compose.n1.yml config --quiet
