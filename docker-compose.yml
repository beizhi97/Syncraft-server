services:
  sync-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singbox-folder-sync-server
    environment:
      HOST: 0.0.0.0
      PORT: 5177
      SERVER_DATA_ROOT: /app-data
      SINGBOX_CONFIG_PATH: /server-singbox/config.json
      SINGBOX_CONTROL_DIR: /singbox-control
      SFSC_TRUST_PROXY: "1"
      SFSC_TRUSTED_PROXY_IPS: 172.16.0.0/12
      SFSC_REQUIRE_ADMIN_TOKEN: "1"
      SFSC_ADMIN_TOKEN: ${SFSC_ADMIN_TOKEN:?set SFSC_ADMIN_TOKEN before starting the server}
      SFSC_BUILD_ID: ${SFSC_BUILD_ID:-}
      SFSC_BUILD_TIME: ${SFSC_BUILD_TIME:-}
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:?set PUBLIC_SERVER_URL before starting the server}
      VLESS_PUBLIC_HOST: ${VLESS_PUBLIC_HOST:?set VLESS_PUBLIC_HOST before starting the server}
      VLESS_PUBLIC_PORT: ${VLESS_PUBLIC_PORT:-}
      VLESS_PORT: ${VLESS_PORT:-45678}
      VLESS_LISTEN_PORT: 45678
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_CLIENT_ENDPOINT: ${S3_CLIENT_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-home-sync}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-syncadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD before starting the server}
    expose:
      - "5177"
    volumes:
      - ./data/app:/app-data
      - ./sing-box:/server-singbox
      - ./data/control:/singbox-control
    depends_on:
      - minio
      - sing-box
    restart: unless-stopped

  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2.10.2-alpine}@${CADDY_IMAGE_DIGEST:-sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d}
    container_name: singbox-folder-sync-caddy
    environment:
      SFSC_PUBLIC_HOST: ${SFSC_PUBLIC_HOST:?set SFSC_PUBLIC_HOST before starting the server}
      SFSC_TUNNEL_PATH: ${SFSC_TUNNEL_PATH:-/sfsc-vless}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      - sync-server
    restart: unless-stopped

  sing-box:
    build:
      context: .
      dockerfile: sing-box.Dockerfile
      args:
        SING_BOX_IMAGE_TAG: ${SING_BOX_IMAGE_TAG:-v1.13.14}
    image: sfsc-sing-box:${SING_BOX_IMAGE_TAG:-v1.13.14}
    container_name: singbox-folder-sync-tunnel
    environment:
      SINGBOX_LISTEN_PORT: ${VLESS_PORT:-45678}
    expose:
      - "45678"
    volumes:
      - ./sing-box:/etc/sing-box:ro
      - ./data/control:/sfsc-control
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 $$SINGBOX_LISTEN_PORT"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:${MINIO_IMAGE_TAG:-RELEASE.2025-09-07T16-13-09Z}@${MINIO_IMAGE_DIGEST:-sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    container_name: singbox-folder-sync-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-syncadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD before starting the server}
    expose:
      - "9000"
      - "9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./data/minio:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:${MINIO_MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}@${MINIO_MC_IMAGE_DIGEST:-sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727}
    container_name: singbox-folder-sync-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-syncadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD before starting the server}
      S3_BUCKET: ${S3_BUCKET:-home-sync}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb -p "local/$$S3_BUCKET" || true
        mc anonymous set none "local/$$S3_BUCKET" || true
